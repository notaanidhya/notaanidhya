name: Generate half-year snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate snake SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: notaanidhya
          WEEKS_TO_SHOW: 26
          STEP_SECONDS: 0.3
        run: |
          node generate-snake.mjs
          DARK=1 OUT_FILE=dist/github-snake-dark.svg node generate-snake.mjs
          OUT_FILE=dist/github-snake-light.svg node generate-snake.mjs

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
